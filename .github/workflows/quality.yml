name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install pytest ruff
      - name: Check code style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest